# Build the package with uv and upload it to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OpenID Connect): no API token is stored in the repository.
# One-time setup on PyPI: add a trusted publisher for MDCHAMP/refjax with
# workflow "python-publish.yml" and environment "pypi".

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Check the release tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/refjax-${version}.tar.gz" || {
            echo "Tag ${GITHUB_REF_NAME} does not match the built version:"; ls dist; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/refjax/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
