[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refjax"
dependencies = ["numpy>=1.22", "jax>=0.4.18", "jaxlib>=0.4.18"]
requires-python = ">=3.9"
authors = [
    { name = "Max D. Champneys", email = "max.champneys@sheffield.ac.uk" },
    { name = "Andrew J. Parnell" },
    { name = "Stephanie L. Burg" },
]
maintainers = [
    { name = "Max Champneys", email = "max.champneys@sheffield.ac.uk" },
]
description = "Lightweight `jit` and `grad` compatible reflectometry in jax."
# readme = "README.md"
license = { file = "LICENSE" }
keywords = ["Reflectometry", "Neutron reflectometry", "jax", "autograd"]
classifiers = [
    "Programming Language :: Python",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
]
dynamic = ["version", "readme"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pandas>=1.4", "refnx>=0.1.33"]

[project.urls]
Repository = "https://github.com/MDCHAMP/refjax"


[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}
version = {attr = "refjax.__version__"}

[tool.setuptools.packages.find]
where = ["src"]