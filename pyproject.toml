[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "refjax"
dependencies = ["numpy>=2.0", "jax>=0.4.26", "jaxlib>=0.4.26"]
requires-python = ">=3.11"
authors = [
    { name = "Max D. Champneys", email = "max.champneys@sheffield.ac.uk" },
    { name = "Stephanie L. Burg" },
]
maintainers = [
    { name = "Max Champneys", email = "max.champneys@sheffield.ac.uk" },
]
description = "Lightweight `jit` and `grad` compatible reflectometry in jax."
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Reflectometry", "Neutron reflectometry", "jax", "autograd"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dynamic = ["version", "readme"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pandas>=2.2.2", "refnx>=0.1.45"]

[project.urls]
Repository = "https://github.com/MDCHAMP/refjax"
Issues = "https://github.com/MDCHAMP/refjax/issues"
Paper = "https://doi.org/10.1038/s43246-026-01341-4"


[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}
version = {attr = "refjax.__version__"}

[tool.setuptools.packages.find]
where = ["src"]